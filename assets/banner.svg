<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.05); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes statusBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 2px #10b981); }
      }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.5; }
        100% { transform: translateY(420px); opacity: 0.2; }
      }
      .pulse-bg {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: dashMove 2.5s linear infinite;
      }
      .data-stream-reverse {
        stroke-dasharray: 6, 6;
        animation: dashMove 3.5s linear infinite reverse;
      }
      .floating-pill-1 { animation: floatSlow 4.5s ease-in-out infinite; }
      .floating-pill-2 { animation: floatFast 3.8s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow 5.2s ease-in-out infinite; }
      .floating-pill-4 { animation: floatFast 4.1s ease-in-out infinite; }
      .status-dot { animation: statusBlink 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)"/>

  <!-- Subtle Outer Border with Gradient -->
  <rect width="1196" height="416" x="2" y="2" rx="14" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Background Dynamic Mesh / Glows (strictly back layer) -->
  <g opacity="0.35">
    <circle cx="200" cy="100" r="180" fill="#3b82f6" filter="url(#glow)" class="pulse-bg" />
    <circle cx="1020" cy="320" r="160" fill="#8b5cf6" filter="url(#glow)" class="pulse-bg" />
    <circle cx="600" cy="40" r="120" fill="#06b6d4" filter="url(#glow)" class="pulse-bg" />
  </g>

  <!-- Technical Grid Pattern -->
  <g opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="550" y1="0" x2="550" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="850" y1="0" x2="850" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="420" stroke="#94a3b8" stroke-width="1"/>
    <line x1="1150" y1="0" x2="1150" y2="420" stroke="#94a3b8" stroke-width="1"/>

    <line x1="0" y1="80" x2="1200" y2="80" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Dynamic Data Flow Streams (Background Behind Text) -->
  <g opacity="0.35">
    <path d="M 50 180 Q 250 120 450 190 T 850 160 T 1150 200" fill="none" stroke="#38bdf8" stroke-width="2" class="data-stream"/>
    <path d="M 50 240 Q 300 290 600 220 T 950 260 T 1150 210" fill="none" stroke="#a855f7" stroke-width="2" class="data-stream-reverse"/>
  </g>

  <!-- Dynamic Interactive Telemetry Pills (Lower / Side Placement - Non Obstructive) -->
  <!-- Pill 1: AIOps & ML -->
  <g class="floating-pill-1" transform="translate(90, 335)">
    <rect width="180" height="42" rx="21" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="5" fill="#10b981" class="status-dot"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🤖 AIOps &amp; ML Engines</text>
  </g>

  <!-- Pill 2: Infrastructure Observability -->
  <g class="floating-pill-2" transform="translate(300, 335)">
    <rect width="215" height="42" rx="21" fill="url(#pillBg)" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="5" fill="#38bdf8" class="status-dot"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">📊 Observability &amp; APM</text>
  </g>

  <!-- Pill 3: CMDB & Asset Mapping -->
  <g class="floating-pill-3" transform="translate(545, 335)">
    <rect width="205" height="42" rx="21" fill="url(#pillBg)" stroke="#c084fc" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="5" fill="#f59e0b" class="status-dot"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🗺️ CMDB &amp; Auto-Topology</text>
  </g>

  <!-- Pill 4: Event & Remediation -->
  <g class="floating-pill-4" transform="translate(780, 335)">
    <rect width="210" height="42" rx="21" fill="url(#pillBg)" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="21" r="5" fill="#10b981" class="status-dot"/>
    <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">⚡ Event Correlation &amp; SLA</text>
  </g>

  <!-- Pill 5: Hybrid Cloud -->
  <g class="floating-pill-1" transform="translate(1020, 335)">
    <rect width="115" height="42" rx="21" fill="url(#pillBg)" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="20" cy="21" r="5" fill="#06b6d4" class="status-dot"/>
    <text x="34" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">☁️ Hybrid</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle (Guaranteed Crisp Foreground) -->
  <g id="foreground-content">
    <!-- Category Badge -->
    <g transform="translate(485, 48)">
      <rect width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
      <circle cx="18" cy="16" r="4.5" fill="#10b981" class="status-dot"/>
      <text x="32" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ENTERPRISE ITOM ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
      Awesome IT Operations Management
    </text>

    <!-- Gradient Accent Subtitle / ITOM -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#primaryGlow)" letter-spacing="3">
      ITOM · AIOps · Observability · Cloud Infrastructure
    </text>

    <!-- Description Paragraph -->
    <text x="600" y="248" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated directory of industry-leading SaaS platforms and open-source solutions
    </text>
    <text x="600" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">
      Empowering SREs, NOC teams, and DevOps engineers with automated correlation &amp; self-healing operations
    </text>
  </g>
</svg>